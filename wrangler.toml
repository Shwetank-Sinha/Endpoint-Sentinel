name = "endpoint-sentinel"
main = "worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = [ "nodejs_compat" ]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[[d1_databases]]
binding = "DB"
database_name = "endpoint-sentinel"
database_id = "443a1db2-5619-4c6d-8690-8d3d8a86b142"
migrations_dir = "migrations"

[[queues.producers]]
binding = "MONITORING_QUEUE"
queue = "endpoint-sentinel-checks"

[[queues.producers]]
binding = "ALERT_QUEUE"
queue = "endpoint-sentinel-alerts"

[[queues.consumers]]
queue = "endpoint-sentinel-checks"
dead_letter_queue = "endpoint-sentinel-checks-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[queues.consumers]]
queue = "endpoint-sentinel-alerts"
dead_letter_queue = "endpoint-sentinel-alerts-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[triggers]
crons = [ "* * * * *" ]

[vars]
PUBLIC_JURY_DEMO = "true"
MAX_JOBS_PER_SCHEDULE = "100"
INCIDENT_FAILURE_THRESHOLD = "2"
INCIDENT_RECOVERY_THRESHOLD = "1"
ALERT_WEBHOOK_FORMAT = "discord"

[observability]
enabled = true
